
# ============================================================
# ENERGY SCOPE PLANNER - CONTROLES AUTOMATICOS ANTES DE CADA COMMIT
# ============================================================
# Proyecto: Energy Scope Planner
#
# OBJETIVO:
# - Validar formato y calidad del codigo Python.
# - Detectar errores de sintaxis en archivos de configuracion.
# - Evitar conflictos de Git y archivos demasiado grandes.
# - Detectar posibles claves privadas.
# - Mantener una ejecucion rapida en el desarrollo local.
# ============================================================

minimum_pre_commit_version: "3.2.0"

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args:
          - "--maxkb=5120"
      - id: detect-private-key
      - id: debug-statements

  - repo: local
    hooks:
      - id: wattwise-ruff-check
        name: Energy Scope Planner - Ruff lint
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: true

      - id: wattwise-ruff-format
        name: Energy Scope Planner - Ruff format
        entry: uv run --no-sync ruff format --check --force-exclude
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: true
